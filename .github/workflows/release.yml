name: Windows Release

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0, v2.1.3, etc.

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: |
          cl /O2 cuebreakpoints.c /Fe:cuebreakpoints.exe
          cl /O2 cuetag.c /Fe:cuetag.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cuebreakpoints.exe
            cuetag.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
